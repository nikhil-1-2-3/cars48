server {
    listen       80;
    server_name  localhost;

    # ─────────────────────────────────────────────
    # Serve the Vite build (React SPA)
    # try_files ensures React Router handles client-side routes
    # ─────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────
    # API proxy — used ONLY in local Docker Compose
    # or when running the frontend container in staging k8s.
    #
    # In PRODUCTION (Vercel), this block is never reached because
    # the frontend is served by Vercel's CDN, not this Nginx.
    # The React app calls VITE_API_BASE_URL directly.
    #
    # For Docker Compose: backend service name is 'backend'
    # For k8s staging:    backend service name is 'renthere-backend-service'
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
