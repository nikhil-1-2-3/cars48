apiVersion: apps/v1
kind: Deployment
metadata:
  name: renthere-frontend
  labels:
    app: renthere-frontend
spec:
  # NOTE: Frontend is deployed on Vercel.
  # This manifest is kept for internal staging / fallback only.
  # In production, the frontend container is not needed in k8s.
  replicas: 1
  selector:
    matchLabels:
      app: renthere-frontend
  template:
    metadata:
      labels:
        app: renthere-frontend
    spec:
      containers:
      - name: frontend-container
        image: singhnikhil212/renthere-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
