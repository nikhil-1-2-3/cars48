apiVersion: v1
kind: Service
metadata:
  name: renthere-backend-service
spec:
  # LoadBalancer provisions an AWS ELB/NLB automatically.
  # The External IP/hostname from 'kubectl get svc' is what you
  # point your EC2 domain / Vercel VITE_API_BASE_URL at.
  type: LoadBalancer
  selector:
    app: renthere-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
