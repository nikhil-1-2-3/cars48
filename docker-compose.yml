services:
  postgres:
    image: postgres:16-alpine
    container_name: cars48_postgres
    restart: always
    environment:
      POSTGRES_USER: cars48_user
      POSTGRES_PASSWORD: cars48_password
      POSTGRES_DB: cars48_db
    ports:
      - "5434:5432"
    volumes:
      - cars48_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cars48_user -d cars48_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cars48_backend
    restart: always
    command: sh -c "npx prisma db push && node seed.js && npm start"
    ports:
      - "5002:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://cars48_user:cars48_password@postgres:5432/cars48_db?schema=public
      JWT_SECRET: supersecretcars48jwtkey12345
      JWT_EXPIRE: 30d
      GOOGLE_CLIENT_ID: mocked_google_client_id
      RAZORPAY_KEY_ID: mockedkey
      RAZORPAY_KEY_SECRET: mockedsecret
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@fleetflow.com}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cars48_frontend
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

  studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cars48_studio
    restart: always
    command: npx prisma studio --port 5555 --browser none
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://cars48_user:cars48_password@postgres:5432/cars48_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cars48_pgdata:
    name: cars48_pgdata
