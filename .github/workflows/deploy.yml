name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]       # runs build+test only on PRs, no deploy

env:
  DOCKER_REGISTRY: singhnikhil212
  BACKEND_IMAGE:   renthere-backend
  FRONTEND_IMAGE:  renthere-frontend

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: Build & push backend Docker image
  # ────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}   # only push on main
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # JOB 2: Build & push frontend Docker image
  # (Frontend is deployed on Vercel — this image is for staging)
  # ────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes on EC2
  # Runs only on push to main, after both builds succeed
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to k8s
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        # KUBECONFIG_BASE64: base64-encoded kubeconfig of the EC2 k3s cluster
        # Get it with: cat ~/.kube/renthere-config | base64 -w 0
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true

      - name: Pin backend image to this commit SHA
        run: |
          sed -i \
            "s|image: ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}|" \
            k8s/backend-deployment.yaml

      - name: Apply k8s manifests
        run: |
          # Apply everything except the secret (managed separately, never in Git)
          kubectl apply --validate=false -f k8s/backend-deployment.yaml
          kubectl apply --validate=false -f k8s/backend-service.yaml
          kubectl apply --validate=false -f k8s/ingress.yaml
          kubectl apply --validate=false -f k8s/frontend-deployment.yaml
          kubectl apply --validate=false -f k8s/frontend-service.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/renthere-backend --timeout=120s

      - name: Run database migrations
        run: |
          # Delete any old migration job, then apply fresh
          kubectl delete job renthere-db-migrate --ignore-not-found
          kubectl apply --validate=false -f k8s/db-migrate-job.yaml
          kubectl wait --for=condition=complete job/renthere-db-migrate --timeout=120s

      - name: Verify deployment
        run: |
          echo "── Pods ──────────────────────────────"
          kubectl get pods
          echo "── Services ──────────────────────────"
          kubectl get svc
